services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olivaras}
      POSTGRES_USER: ${POSTGRES_USER:-olivaras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olivaras} -d ${POSTGRES_DB:-olivaras}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      WAND_IMAGE_DIRECTORY: /app/wand-images
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-olivaras}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-olivaras}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - wand_images:/app/wand-images
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  wand_images:
