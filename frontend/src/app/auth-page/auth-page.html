<app-store-navigation />

<main class="auth-page page-shell">
  <section class="auth-panel arch-frame">
  <h1 id="auth-title">{{ view() === 'login' ? 'Entrar' : 'Criar conta' }}</h1>

  @if (errorMessage()) {
    <p role="alert">{{ errorMessage() }}</p>
  }

  @if (successMessage()) {
    <p role="status">{{ successMessage() }}</p>
  }

  @if (view() === 'login') {
    <section class="auth-form-section" aria-labelledby="auth-title">

      <form (ngSubmit)="submitLogin()" #loginFormElement="ngForm">
        <p>
          <label for="login-email">E-mail</label><br>
          <input id="login-email" name="email" type="email" autocomplete="email"
                 required [(ngModel)]="loginForm.email">
        </p>

        <p>
          <label for="login-password">Senha</label><br>
          <input id="login-password" name="password" type="password"
                 autocomplete="current-password" required maxlength="72"
                 [(ngModel)]="loginForm.password">
        </p>

        <div class="auth-form-actions">
          <button class="etched-control" type="submit" [disabled]="loading() || loginFormElement.invalid">
            {{ loading() ? 'Entrando...' : 'Entrar' }}
          </button>
          <span>Não tem uma conta? <button class="auth-view-link" type="button" (click)="selectView('register')" [disabled]="loading()">Registre-se agora</button></span>
        </div>
      </form>
    </section>
  } @else {
    <section class="auth-form-section auth-register" aria-labelledby="auth-title">

      <form class="register-grid" (ngSubmit)="submitRegister()" #registerFormElement="ngForm">
        <p>
          <label for="profile-name">Nome de perfil</label><br>
          <input id="profile-name" name="profileName" type="text" autocomplete="nickname"
                 required minlength="2" maxlength="80" [(ngModel)]="registerForm.profileName">
        </p>

        <p>
          <label for="register-email">E-mail</label><br>
          <input id="register-email" name="email" type="email" autocomplete="email"
                 required maxlength="254" [(ngModel)]="registerForm.email">
        </p>

        <p>
          <label for="phone">Telefone</label><br>
          <input id="phone" name="phone" type="tel" autocomplete="tel" required
                 pattern="^\+?[0-9 ()-]{10,30}$" [(ngModel)]="registerForm.phone">
        </p>

        <p>
          <label for="birth-date">Data de nascimento</label><br>
          <input id="birth-date" name="birthDate" type="date" autocomplete="bday" required
                 [(ngModel)]="registerForm.birthDate">
        </p>

        <p>
          <label for="register-password">Senha</label><br>
          <input id="register-password" name="password" type="password" autocomplete="new-password"
                 required maxlength="72" [(ngModel)]="registerForm.password">
        </p>
        <p>
          <label for="register-confirm-password">Confirmar senha</label><br>
          <input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password"
                 required maxlength="72" [(ngModel)]="confirmRegisterPassword">
        </p>

        <div class="auth-form-actions">
          <button class="etched-control" type="submit" [disabled]="loading() || registerFormElement.invalid">
            {{ loading() ? 'Criando conta...' : 'Criar conta' }}
          </button>
          <span>Já tem uma conta? <button class="auth-view-link" type="button" (click)="selectView('login')" [disabled]="loading()">Faça login aqui</button></span>
        </div>
      </form>
    </section>
  }
  </section>
</main>
